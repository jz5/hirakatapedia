# 市の一覧やカテゴリに出てくるが、載せないページ（スクリプトが「新しいページ」として知らせないように）
ignore:
  # 市の「オープンデータ一覧」の CSV（2022年）に残っているが、ページが無いもの
  - "0000018227" # 人口統計情報（統計情報のカテゴリに移った）
  - "0000021829" # 保健センター便利帳
  - "0000021830" # がん検診
  - "0000036814" # 令和2年度事務概要（事務概要は 0000048776）
  - "0000037178" # デザインマンホール蓋
  # データではないお知らせ
  - "0000054427" # 図書館の臨時休館のお知らせ

# 国・府などのデータ（このサイトでは取ってこない。リンクだけ）
external:
  - title: e-Stat 市区町村のデータ（枚方市）
    publisher: 総務省統計局ほか
    url: https://www.e-stat.go.jp/municipalities/cities/areacode?selectedAreaCode=27210
    desc: 国勢調査などの国の統計の、枚方市の数字。ほかの市と同じ形で比べられる
  - title: 地図で見る統計（jSTAT MAP）
    publisher: 総務省統計局
    url: https://www.e-stat.go.jp/gis/statmap-search?type=2
    desc: 国勢調査の町丁ごとの人口などを地図にできる。境界のデータも落とせる
  - title: e-Stat 地域統計データベース
    publisher: 総務省統計局
    url: https://www.e-stat.go.jp/regional-statistics/ssdsview/municipality
    desc: 人口・経済・教育・福祉などの数字を、市町村ごとに並べて比べられる
  - title: 財政状況資料集（全国の市町村）
    publisher: 総務省
    url: https://www.soumu.go.jp/iken/zaisei/jyoukyou_shiryou/index.html
    desc: 全国の市町村の決算を同じ形でまとめたもの。ほかの市と比べるならこちら
  - title: RESAS 地域経済分析システム
    publisher: 経済産業省・内閣官房
    url: https://resas.go.jp/
    desc: 人口・産業・観光などを地図とグラフで見られる
  - title: 国土数値情報
    publisher: 国土交通省
    url: https://nlftp.mlit.go.jp/ksj/
    desc: 行政区域・駅・学校・浸水想定区域などの地図のデータ
  - title: 地理院地図・地理院タイル
    publisher: 国土地理院
    url: https://maps.gsi.go.jp/development/ichiran.html
    desc: 地図・航空写真・昔の地形図。このサイトの地図もこれを使っている
  - title: 重ねるハザードマップ
    publisher: 国土交通省・国土地理院
    url: https://disaportal.gsi.go.jp/
    desc: 洪水・土砂災害・津波などの危ないところを地図に重ねて見られる
  - title: 不動産情報ライブラリ
    publisher: 国土交通省
    url: https://www.reinfolib.mlit.go.jp/
    desc: 土地の取引価格・地価公示・都市計画などを地図で見られる
  - title: 大阪府の毎月推計人口
    publisher: 大阪府
    url: https://www.pref.osaka.lg.jp/fuseiunei/toukeijouhou/toukeikajisshinochousa/maitsukisuikeijinkou/index.html
    desc: 府内の市町村の人口を毎月推計したもの。ほかの市と比べられる
  - title: 大阪府の統計（分野別）
    publisher: 大阪府
    url: https://www.pref.osaka.lg.jp/o040090/toukei/top_portal/bunya.html
    desc: 大阪府の統計の入口
  - title: 大阪府都市計画基礎調査（枚方市）
    publisher: 大阪府
    url: https://www.geospatial.jp/ckan/dataset/osaka-r7-hirakata
    desc: 土地の使い方・建物などの都市計画の調査のデータ（G空間情報センター）
  - title: 登記所備付地図データ（枚方市）
    publisher: 法務省
    url: https://www.geospatial.jp/ckan/dataset/houmusyouchizu-2026-1-1303
    desc: 法務局の地図（公図）のデータ（G空間情報センター）
  - title: きてみてひらかたマップ
    publisher: 枚方市
    url: https://www2.wagmap.jp/hirakata/Portal
    desc: 市の地図のサイト。都市計画・道路・上下水道などの地図
