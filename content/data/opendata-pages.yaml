# データのページ（/data/）の「市のデータの一覧」に載せる、枚方市のページ。
# 題名（title）と説明（desc）は、読む人向けに書く（何が分かるデータか、1 行で）。
# ファイルのリンク・更新日・利用条件は、python3 scripts/opendata-catalog.py が市のページから取ってきて
# content/data/opendata-catalog.json に書く。市の一覧に新しいページが増えていたら、スクリプトが知らせるので、ここに足す。
#
#   id:       市のページ番号（https://www.city.hirakata.osaka.jp/<id>.html）
#   category: 分野（市の分け方に合わせる）
#   inList:   市の「オープンデータ一覧」やオープンデータのカテゴリに載っているか（false は統計・財政・防災など、一覧の外）
#   view:     このサイトで表や地図にしているもの（/data/<view>/）
#   note:     読む人に知らせたい注意（古い、個人名を含む、など）

pages:
