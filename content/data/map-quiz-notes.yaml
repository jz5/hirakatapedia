# 枚方市地図クイズ（/data/map-quiz/）の「この地区のひとこと」データ。
# 正解ダイアログと「地図で調べる」の上部に表示される。
# 1 地区ずつ書き足せ、保存するとそのまま反映される。
# 各地区の境界の中に実在する場所・出来事だけを書く。
#
# tag（開発サーバーの管理用一覧で区別・絞り込みに使う）：
#   - 記事あり   ：このサイトの公開記事から抜粋
#   - 小ネタ     ：市公式・公的機関・社史などの出典がある話
#   - 伝承・噂   ：言い伝え・由来諸説（断定しない）

香里ケ丘:
  tag: 記事あり
  text: ケネディ大統領の弟・ロバート・ケネディも来た！ 1958年に入居が始まった「東洋一のマンモス団地」香里団地が広がるエリアで、視察に訪れた。
  source: "[枚方pedia「枚方市は40万人いた？」](/jinko/)"

岡東町:
  tag: 記事あり
  text: TSUTAYA の1号店が生まれた町！ 1983年に「蔦屋書店 枚方駅前店」が現在の餃子の王将の場所に開業し、のちに近鉄百貨店跡へ枚方T-SITE が建った。
  source: "[枚方pedia「TSUTAYA は枚方発祥！」](/tsutaya/)"

岡本町:
  tag: 記事あり
  text: 枚方ビオルネに「曲がるエスカレーター」がある！ 三菱電機しか作れない特製設備で、国内での製造はわずか37台、大阪府内は3か所だけ（2021年時点）。
  source: "[枚方pedia「枚方ビオルネの曲がるエスカレーターはすごいのか？」](/viorne/)"

新町:
  tag: 記事あり
  text: 枚方市駅前の細長い「関医タワー」がある町！ 関西医科大学の建物で、12階建てなのに高さ116mあり、人が使う階は下段（11階でも約37m）にまとまっていて上層階に部屋はない。
  source: "[枚方pedia「枚方の細長いタワー『関医タワー』とは？」](/kmu-tower/)"

大垣内町:
  tag: 小ネタ
  text: 枚方市役所がある行政のど真ん中！ 1947年に市になったとき（人口約4万2千人）から続く枚方の中枢エリア。
  source: "[枚方市公式](https://www.city.hirakata.osaka.jp/)・[枚方pedia「枚方市は40万人いた？」](/jinko/)"

楠葉花園町:
  tag: 記事あり
  text: 「くずはモール」と京阪・樟葉駅がある商業の中心地！ 前身のくずはモール街（1972年開業）は屋根のないオープンモールで全国から注目された。駅名と町名で漢字が違う。
  source: "[枚方pedia「くずはモールは日本初のショッピングモール？」](/kuzuha-mall/)"

南楠葉:
  tag: 記事あり
  text: 京阪の「くずはローズタウン」開発などで住宅街が広がった樟葉エリアの一角！ 樟葉地区の人口は1960〜80年の20年間で19.1倍に急増した。
  source: "[枚方pedia「枚方市は40万人いた？」](/jinko/)・[「くずはモールは日本初のショッピングモール？」](/kuzuha-mall/)"

田口山:
  tag: 記事あり
  text: オムライス「ポムの樹」成功の原点があった町！ 茨木で苦戦した創業者がここで大盛りピラフの人気店を育て、近鉄百貨店枚方店での1号店につながった。
  source: "[枚方pedia「ポムの樹は枚方で成功した！」](/pomunoki/)"

車塚:
  tag: 記事あり
  text: 枚方市立中央図書館は、もともと大学の図書館だった！ 関西外国語大学の旧・片鉾学舎図書館棟を譲り受けてこの地に2005年開館し、貸出数は中核市トップクラス。
  source: "[枚方pedia「枚方の図書館は何がすごい？」](/toshokan/)"

北山:
  tag: 記事あり
  text: 「枚方の国会議事堂」がそびえる町！ 大阪工業大学枚方キャンパスの1号館は、参議院議員を約30年務めた当時の理事長の発案と伝えられる。
  source: "[枚方pedia「枚方の国会議事堂はなぜ？」](/kokkai/)"

星丘:
  tag: 記事あり
  text: 「暑い枚方」のアメダス観測所があるのは実はここ！ 枚方が暑いのは盆地だからではなく、海風が届きにくく風が弱いため暖かい空気がたまりやすいから。
  source: "[気象庁（枚方アメダス）](https://www.data.jma.go.jp/stats/etrn/view/annually_a.php?prec_no=62&block_no=1065&view=a2)・[枚方pedia「枚方はなぜ暑い？」](/atsui/)"

宮之阪:
  tag: 小ネタ
  text: 宮之阪駅はもともと「中宮駅」だった！ 1940年の開業以来、周辺を中宮と勘違いする人が続出し、地元の要望で1971年6月に改称された。
  source: "京阪電気鉄道『京阪百年のあゆみ 資料編』・[枚方市『写真で見るひらかた今昔』](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000006/6452/54930.pdf)"

枚方公園町:
  tag: 小ネタ
  text: 人口 0 人の町！ 町域の大半をひらかたパークが占める（2020年国勢調査）。ひらパーは遊園地が先ではなく、1912年に菊人形の会場が移ってきたのが始まり。
  source: "[2020年国勢調査（枚方市）](https://www.city.hirakata.osaka.jp/0000037541.html)・[京阪グループ レポート（ひらかたパーク）](https://www.keihan.co.jp/brand/report/report-47/)"

三矢町:
  tag: 小ネタ
  text: ベトナムから来た象も泊まった東海道56番目の宿場町！ 1729年に江戸へ向かう象が枚方宿に宿泊。1952年創業の氷屋のかき氷「枚方凍氷」もある。
  source: "[枚方市『虎の巻』](https://www.city.hirakata.osaka.jp/0000017292.html)・[枚方市公式（枚方宿）](https://www.city.hirakata.osaka.jp/0000002969.html)"

堤町:
  tag: 小ネタ
  text: 江戸時代の船待ち宿がそのまま資料館として残る！ 淀川舟運の中継港・枚方宿で栄えた「鍵屋」の建物が、市立枚方宿鍵屋資料館になっている。
  source: "[市立枚方宿鍵屋資料館](https://kagiya.hirakata-kanko.org/)・[枚方市公式](https://www.city.hirakata.osaka.jp/0000002969.html)"

桜町:
  tag: 小ネタ
  text: 明治の大洪水「伊加賀切れ」を伝える洪水碑が立つ淀川沿い！ 1885年に淀川堤防が決壊して大阪市中まで浸水し、のちの新淀川開削のきっかけになった。
  source: "[国土交通省淀川河川事務所（明治18年大洪水）](https://www.kkr.mlit.go.jp/yodogawa/know/history/flood_record/flood_1885_shosai.html)・[枚方市公式（明治18年洪水碑）](https://www.city.hirakata.osaka.jp/0000027839.html)"

伊加賀西町:
  tag: 小ネタ
  text: 淀川沿いに広がる伊加賀エリアで人口6,500人超！ 明治18年（1885年）に大阪を水浸しにした大洪水は、この一帯の名をとって「伊加賀切れ」と呼ばれる。
  source: "[2020年国勢調査（枚方市）](https://www.city.hirakata.osaka.jp/0000037541.html)・[枚方市公式（明治18年洪水碑）](https://www.city.hirakata.osaka.jp/0000027839.html)"

東香里:
  tag: 小ネタ
  text: 長年地域の目印だった巨大な高架水槽が姿を消した！ 坂道の多い住宅街に建っていた東香里高架水槽は、2024〜2025年度の市工事で廃止・撤去された。
  source: "[枚方市上下水道局（東香里高架水槽撤去工事）](https://www.city.hirakata.osaka.jp/suidou/0000052076.html)"

北中振:
  tag: 小ネタ
  text: 京阪・光善寺駅があり、その始まりは臨時停車だった！ 近くの光善寺への参詣客のために設けられた臨時乗降場が、のちに常設駅になったと伝わる。
  source: "[枚方市『虎の巻』](https://www.city.hirakata.osaka.jp/0000017292.html)"

出口:
  tag: 伝承・噂
  text: 「出口御坊・光善寺」に大蛇の伝説が残る！ 蓮如上人が1475年に開いた境内の「さいかちの木」（府天然記念物）を、説法に救われた大蛇が伝って天に昇ったと伝わる。
  source: "[光善寺公式（参詣案内・さいかちの木）](https://www.kouzenzi.org/sankeiannai/index.html)"

村野高見台:
  tag: 小ネタ
  text: 「村野浄水場」が丘の上に広がる！ 単一の浄水場として日本最大級の規模で、地上7階・地下2階の珍しい「立体式」構造から大阪府内の広い範囲へ水道水を送っている。
  source: "[大阪広域水道企業団（村野浄水場）](https://www.wsa-osaka.jp/soshiki/murano_josui/index.html)"

村野西町:
  tag: 小ネタ
  text: 閉校した小学校が市民活動の拠点に生まれ変わった！ 旧・村野小学校の校舎を活用した「サプリ村野」があり、地域のスポーツやNPOの場になっている。
  source: "[枚方市公式（サプリ村野）](https://www.city.hirakata.osaka.jp/0000045132.html)"

村野本町:
  tag: 小ネタ
  text: 京阪交野線・村野駅の足元に広がる旧村野村の中心！ 駅の東には天野川が流れ、丘の上には府内有数の規模を持つ村野浄水場が控える。
  source: "[大阪広域水道企業団（村野浄水場）](https://www.wsa-osaka.jp/soshiki/murano_josui/index.html)・[枚方市公式](https://www.city.hirakata.osaka.jp/)"

山之上:
  tag: 小ネタ
  text: かつては竹細工の一大産地だった！ 名前の通り坂の多い丘陵地で今は閑静な住宅街だが、戦前から戦後にかけて花かごなどの竹製品づくりが盛んだった。
  source: "[枚方市公式『あんなとこ こんなトコ』（山之上・竹細工）](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000000/394/6036.pdf)"

中宮西之町:
  tag: 小ネタ
  text: 国の特別史跡「百済寺跡」がある歴史エリア！ 東大寺の大仏に黄金を献上した百済王敬福ら一族の寺跡で、大阪府内にごく少ない特別史跡に指定されている。
  source: "[枚方市公式（特別史跡 百済寺跡）](https://www.city.hirakata.osaka.jp/0000000767.html)"

禁野本町:
  tag: 小ネタ
  text: 地名の「禁」は天皇専用の立入禁止の狩場から！ のちに旧陸軍の火薬庫が置かれ、1939年3月1日の大爆発事故は「枚方市平和の日」の由来になった。
  source: "[枚方市公式（禁野火薬庫）](https://www.city.hirakata.osaka.jp/0000003340.html)・[枚方市平和の日](https://www.city.hirakata.osaka.jp/0000033006.html)"

御殿山町:
  tag: 小ネタ
  text: 御殿山駅ができたきっかけは美術学校の移転！ 1929年に南画家・矢野橋村らの大阪美術学校がここへ移り、京阪が駅を新設。跡地は生涯学習美術センターになっている。
  source: "[枚方市公式『あんなとこ こんなトコ』（御殿山）](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000000/394/6054.pdf)"

渚本町:
  tag: 伝承・噂
  text: 御殿山神社があるのは御殿山町ではなく実はここ！ 江戸初期に淀藩主・永井氏が陣屋を置いた丘に、明治3年（1870年）に社殿を移して改称された。
  source: "[枚方市公式『あんなとこ こんなトコ』（御殿山神社）](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000000/394/6054.pdf)"

渚元町:
  tag: 伝承・噂
  text: 在原業平が桜の下で歌を詠んだ『伊勢物語』の舞台！ 平安時代に惟喬親王が別荘「渚院」を営んだ史跡が残る。
  source: "[枚方市公式（渚院跡）](https://www.city.hirakata.osaka.jp/0000002755.html)"

牧野阪:
  tag: 小ネタ
  text: 節分に「鬼は外」ではなく「鬼は内」と唱える神社がある！ 鎮座する片埜神社は鬼が守り神で、絵馬にも鬼の面が描かれている。
  source: "[片埜神社公式](https://www.katanojinja.com/blank-3)"

楠葉中之芝:
  tag: 小ネタ
  text: 勝海舟が関わった砲台が日本で唯一ここに残る！ 1865年完成の国史跡「楠葉台場跡」は、外国船が淀川をさかのぼるのを防ぐために築かれた河川台場。
  source: "[枚方市公式（国史跡 楠葉台場跡）](https://www.city.hirakata.osaka.jp/0000051979.html)"

町楠葉:
  tag: 小ネタ
  text: 京阪・樟葉駅の西側に広がる旧・楠葉村の中心！ 淀川河川敷に接し、北へ歩けば幕末の国史跡・楠葉台場跡へつながる歴史ある一帯。
  source: "[枚方市公式（国史跡 楠葉台場跡）](https://www.city.hirakata.osaka.jp/0000051979.html)"

楠葉丘:
  tag: 伝承・噂
  text: 継体天皇が即位した「樟葉宮」の伝承地！ 『日本書紀』に507年即位と記される宮の跡が、この町の交野天神社周辺にあったと伝わる。
  source: "[枚方市公式（樟葉宮跡の杜）](https://www.city.hirakata.osaka.jp/0000000636.html)"

船橋本町:
  tag: 伝承・噂
  text: 舟をずらりと並べて橋にした！？ 昔、川に架かる橋が流された際に舟をつないで渡ったという言い伝えが地名の由来で、江戸時代の『河内名所図会』にも載っている。
  source: "[枚方市公式『あんなとこ こんなトコ』（船橋）](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000000/394/6065.pdf)・『河内名所図会』（1801年）"

招提元町:
  tag: 小ネタ
  text: 戦国時代に土塁と堀に囲まれた自治都市があった！ 1543年に敬応寺を中心に築かれた「招提寺内町」の跡で、山崎の合戦で明智光秀側につき特権を失ったと伝わる。
  source: "[枚方市公式『あんなとこ こんなトコ』（招提寺内町）](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000000/394/6021.pdf)"

招提田近:
  tag: 小ネタ
  text: 国勢調査の人口は 0 人！ 「塩こん部長」でおなじみ、くらこんホールディングスの本社・主力工場などが入る工業団地。
  source: "[2020年国勢調査（枚方市）](https://www.city.hirakata.osaka.jp/0000037541.html)・[くらこん公式](https://www.kurakon.jp/)"

山田池公園:
  tag: 小ネタ
  text: 統計上の人口は 0 人、面積は市内屈指の広大な府営公園！ 平安時代からの灌漑池・山田池を核とし、枚方八景「山田池の月」や花菖蒲で知られる。
  source: "[大阪府営 山田池公園公式](https://yamadaike.osaka-park.or.jp/)・[枚方市公式（枚方八景）](https://www.city.hirakata.osaka.jp/0000001701.html)"

長尾元町:
  tag: 小ネタ
  text: JR長尾駅があり、学研都市線の快速も停まる枚方東部の玄関口！ 近くには1960年代造成の日本有数の家具専門団地「枚方家具団地」が広がる。
  source: "[枚方家具団地協同組合](https://www.kagudanchi.com/)・[枚方市公式](https://www.city.hirakata.osaka.jp/)"

長尾家具町:
  tag: 小ネタ
  text: 町じゅうに家具店がずらりと並ぶ「枚方家具団地」の町！ 1960年代に造成された全国でも珍しい家具専門の商業団地。
  source: "[枚方家具団地協同組合](https://www.kagudanchi.com/)"

藤阪東町:
  tag: 伝承・噂
  text: 「伝王仁墓」は古くは歯痛にご利益がある「おに墓」だった！？ この町に伝わる塚は、のちに漢字を伝えた渡来人・王仁の墓として顕彰されるようになった。
  source: "[枚方市公式（伝王仁墓）](https://www.city.hirakata.osaka.jp/0000051977.html)"

藤阪天神町:
  tag: 小ネタ
  text: 江戸時代の鋳物師の家を丸ごと移築した資料館がある！ 旧田中家鋳物民俗資料館では、高温作業の煙を抜く「風袋」など当時の職人の工夫をそのまま見られる。
  source: "[枚方市公式（旧田中家鋳物民俗資料館）](https://www.city.hirakata.osaka.jp/0000051942.html)"

津田駅前:
  tag: 小ネタ
  text: 1955年まで独立した「津田町」だったエリアの玄関口！ 標高約300mの展望スポット・枚方八景「国見山」へのハイキング起点でもある。
  source: "[枚方市公式（枚方八景・国見山）](https://www.city.hirakata.osaka.jp/0000001701.html)"

王仁公園:
  tag: 小ネタ
  text: 漢字を伝えたと伝わる渡来人・王仁（わに）にちなむ市立公園！ 夏の市民プールや広大な芝生広場は枚方市民におなじみ。
  source: "[枚方市公式（王仁公園）](https://www.city.hirakata.osaka.jp/0000004640.html)"

穂谷:
  tag: 小ネタ
  text: 大阪府内とは思えない棚田とコスモスの里山！ 枚方市最東部にあり、古くは大和へ抜ける「穂谷越え」の要衝だった。
  source: "[枚方市公式（穂谷の里山）](https://www.city.hirakata.osaka.jp/0000004682.html)"

尊延寺:
  tag: 伝承・噂
  text: 奈良時代（731年）創建と伝わる古刹がそのまま町名に！ 本堂に伝わる平安時代の降三世明王立像・軍荼利明王立像は国の重要文化財に指定されている。
  source: "[枚方市公式（尊延寺）](https://www.city.hirakata.osaka.jp/vod/0000053915.html)・[尊延寺公式](https://sonenji.jp/about.htm)"

氷室台:
  tag: 小ネタ
  text: 平安時代、朝廷へ献上する冬の氷を夏まで貯蔵していた！？ 『日本紀略』にも記された河内の「氷室」の古跡にちなむ地名。
  source: "[枚方市公式『あんなとこ こんなトコ』（氷室）](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000000/394/6052.pdf)"

茄子作:
  tag: 伝承・噂
  text: 「なす」を作る村だった？ 由来はナゾのまま！ ナスの産地説や鷹狩りの鈴（名鈴）を作った村説などがあるが、枚方市も「確かな根拠はない」としている。
  source: "[枚方市公式『あんなとこ こんなトコ』（茄子作）](https://www.city.hirakata.osaka.jp/cmsfiles/contents/0000000/394/6025.pdf)"

菊丘南町:
  tag: 小ネタ
